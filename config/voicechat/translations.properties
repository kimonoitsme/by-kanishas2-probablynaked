force_voicechat_kick_message=\u0420\u2019\u0420\u00B0\u0420\u0458 \u0420\u0457\u0420\u0455\u0421\u201A\u0421\u0402\u0420\u00B5\u0420\u00B1\u0421\u0453\u0420\u00B5\u0421\u201A\u0421\u0403\u0421\u040F %s %s \u0420\u0491\u0420\u00BB\u0421\u040F \u0420\u0451\u0420\u0456\u0421\u0402\u0421\u2039 \u0420\u0405\u0420\u00B0 \u0421\u040C\u0421\u201A\u0420\u0455\u0420\u0458 \u0421\u0403\u0420\u00B5\u0421\u0402\u0420\u0406\u0420\u00B5\u0421\u0402\u0420\u00B5.
